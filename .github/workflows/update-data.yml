name: 更新遊戲資料

on:
  schedule:
    - cron: '0 2 1 * *'   # 每月 1 日 02:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 下載 CSV 並重建 data/*.json
        run: python3 -I scripts/build_data.py --fetch --raw "$RUNNER_TEMP/raw" --out data
      - name: 提交變更
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "chore: 更新遊戲資料"
            git push
          fi
